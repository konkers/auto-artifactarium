// Some packets aren't included in the client,
// therefore, they wont exist in dumps.
//
// The remaining ones that we *do* use exist
// only on the server, and so we leave them here.
//
// Other messages are exclusive to Starlight's server infrastructure.

syntax = "proto3";

option csharp_namespace = "Starlight.Protocol";

import "google/protobuf/descriptor.proto";

extend google.protobuf.FieldOptions {
  optional string mask = 50001;
  optional int32 add = 50002;
  optional int32 xor = 50003;
  optional string fop = 50004;

  repeated string alts = 50005;
}

message PacketHead {
  // uint32 packet_id = 1;
  // uint32 rpc_id = 2;
  uint32 client_sequence_id = 3;
  // uint32 enet_channel_id = 4;
  // uint32 enet_is_reliable = 5;
  uint64 sent_ms = 6;
  uint32 flags = 7;
  uint32 decompressed_len = 8;
  uint32 chunk_id = 9;
  uint32 total_chunks_count = 10;
  // uint32 user_id = 11;
  // uint32 user_ip = 12;
  // uint32 user_session_id = 13;
  // uint32 home_user_id = 14;
  // uint64 recv_time_ms = 21;
  // uint32 rpc_begin_time_ms = 22;
  // map<uint32, uint32> ext_map = 23;
  // uint32 sender_app_id = 24;
  // uint32 sender_load = 25;
  // bytes span_context_str = 26;
  // uint32 source_service = 31;
  // uint32 target_service = 32;
  // map<uint32, uint32> service_app_id_map = 33;
  // bool is_set_game_thread = 34;
  // uint32 game_thread_index = 35;
  // bool is_set_multi_thread = 36;
  // uint32 multi_thread_index = 37;
}

// Sent as a POCO between the server & its tunnels (and back).
// Encapsulates the packet data received from the client as decrypted payloads.
//
// This is a tunnel message.
// Subject: <used on numerical IDs>
message PlayerPacketNotify {
  bytes metadata = 1;
  bytes payload = 2;
}

// Sent by the game server over its gate tunnel to drop a client.
// When `flush` is set, the gate waits until every queued packet has been
// acknowledged by the client before tearing the connection down, so a
// farewell packet published just before this one is guaranteed to arrive.
//
// This is a tunnel message.
// Subject: `game.gate.disconnect`
message DisconnectNotify {
  uint32 reason = 1;
  bool flush = 2;
}
